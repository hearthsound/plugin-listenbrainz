[package]
name = "hearthsound-plugin-listenbrainz"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "A Hearthsound scrobbling and discovery plugin backed by ListenBrainz"
repository = "https://github.com/hearthsound/plugin-listenbrainz"

[lib]
crate-type = ["cdylib"]

[dependencies]
hearthsound-plugin = { git = "https://github.com/hearthsound/plugin-sdk", tag = "v0.4.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
